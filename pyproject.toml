[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "firms-harmonization"
version = "0.1.0"
description = "Reproducible, exposure-aware processing of NASA FIRMS MODIS and VIIRS detections"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.2",
  "geopandas>=1.0",
  "matplotlib>=3.9",
  "numpy>=2.1",
  "pandas>=2.2",
  "pyarrow>=18",
  "pyproj>=3.7",
  "scipy>=1.14",
  "shapely>=2.0",
  "statsmodels>=0.14.4",
]

[project.optional-dependencies]
coverage = [
  "earthaccess>=0.19",
  "pyproj>=3.7",
  "rasterio>=1.5",
  "shapely>=2.0",
]
test = ["pytest>=8.3"]

[project.scripts]
firms-coverage = "firms_harmonization.coverage_data:main"
firms-harmonize = "firms_harmonization.cli:main"
firms-build-web-data = "firms_harmonization.web_data:main"
firms-serve-web-data = "firms_harmonization.web_api:main"

[tool.setuptools.packages.find]
include = ["firms_harmonization*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
